name: tse_midia_digital
version: "1.0.0"
config-version: 2
profile: tse_midia_digital

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

models:
  tse_midia_digital:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  tse_midia_digital:
    +schema: seeds
    fornecedores_classificados_llm:
      +column_types:
        cpf_cnpj_fornecedor: string
        nm_fornecedor: string
        plataforma: string
        confianca: float64
        eh_intermediario: bool
        justificativa: string
        modelo: string
        classificado_em: timestamp
